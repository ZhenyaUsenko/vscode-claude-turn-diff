name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and verify version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "vsix=claude-turn-diff-${PKG}.vsix" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: |
          node --check extension.js
          bash -n hooks/turn-diff.sh

      - name: Verify README images exist
        run: |
          missing=0
          while IFS= read -r p; do
            case "$p" in http*) continue ;; esac
            if [ ! -f "$p" ]; then
              echo "::error::README references a missing image: $p"
              missing=1
            fi
          done < <(grep -o '!\[[^]]*\]([^)]*)' README.md | sed 's/.*](//; s/)$//')
          [ "$missing" = 0 ]

      - name: Package
        run: npx --yes @vscode/vsce@latest package --out "${{ steps.version.outputs.vsix }}"

      - name: Check whether this version is already published
        id: marketplace
        run: |
          ID="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          npx --yes @vscode/vsce@latest show "$ID" --json > marketplace.json 2>/dev/null || true
          if node -e '
            const fs = require("fs")
            let d
            try { d = JSON.parse(fs.readFileSync("marketplace.json", "utf8")) } catch { process.exit(1) }
            const versions = Array.isArray(d.versions) ? d.versions.map((v) => v.version) : []
            process.exit(versions.includes(process.argv[1]) ? 0 : 1)
          ' "${{ steps.version.outputs.version }}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${ID}@${{ steps.version.outputs.version }} is already on the Marketplace — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Marketplace
        if: steps.marketplace.outputs.already != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@latest publish --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section for ${{ steps.version.outputs.version }}"
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="${{ steps.version.outputs.vsix }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists — refreshing its asset"
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          elif [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
