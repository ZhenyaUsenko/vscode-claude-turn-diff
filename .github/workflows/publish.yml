name: Publish

# Tag-driven release. package.json is the source of truth for the version;
# the tag only confirms it, and the run fails if the two disagree — publishing
# the wrong version is unrecoverable, since a version number cannot be reused.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and verify version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "vsix=claude-turn-diff-${PKG}.vsix" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: |
          node --check extension.js
          bash -n hooks/turn-diff.sh

      # The README's relative image links are rewritten to raw.githubusercontent
      # URLs at package time, so a missing file means a broken listing image
      # that cannot be fixed without burning the version.
      - name: Verify README images exist
        run: |
          missing=0
          while IFS= read -r p; do
            case "$p" in http*) continue ;; esac
            if [ ! -f "$p" ]; then
              echo "::error::README references a missing image: $p"
              missing=1
            fi
          done < <(grep -o '!\[[^]]*\]([^)]*)' README.md | sed 's/.*](//; s/)$//')
          [ "$missing" = 0 ]

      - name: Package
        run: npx --yes @vscode/vsce@latest package --out "${{ steps.version.outputs.vsix }}"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section for ${{ steps.version.outputs.version }}"
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
